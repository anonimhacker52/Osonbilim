name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 24.04 EMAS, 22.04 ishlatamiz
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # 3.14 EMAS, 3.11 ishlatamiz
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            wget \
            curl
      
      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0
          pip3 install cython==0.29.36
      
      #  MUHIM: Android SDK ni qo'lda o'rnatish
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip
      
      # 👇 MUHIM: Litsenziyalarni avtomatik qabul qilish
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      # 👇 MUHIM: Build-Tools 33.0.0 ni o'rnatish (37 EMAS)
      - name: Install Android SDK Components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0"
      
      # 👇 MUHIM: buildozer.spec ni to'g'rilash
      - name: Fix buildozer.spec
        run: |
          # Agar buildozer.spec bo'lmasa, yaratamiz
          if [ ! -f buildozer.spec ]; then
            cat > buildozer.spec << 'EOF'
[app]
title = Oson Bilim - Ingliz Tili
package.name = osonbilim
package.domain = org.osonbilim
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,json
version = 1.0
requirements = python3,kivy==2.2.1,kivymd==1.1.1
orientation = portrait
fullscreen = 0
android.permissions = INTERNET
android.arch = arm64-v8a
android.api = 33
android.minapi = 21
android.ndk = 25.2.9519653
icon.filename = icon.png
EOF
          fi
          
          # Build-Tools versiyasini 33 ga o'zgartirish
          sed -i 's/android.build_tools_version = .*/android.build_tools_version = 33.0.0/' buildozer.spec
      
      - name: Build APK
        run: |
          # Buildozer ni ishga tushirish
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: osonbilim-apk
          path: bin/*.apk
