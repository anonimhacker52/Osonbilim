name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 24.04 emas, 22.04 ishlatamiz (barqaror)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Python 3.14 emas, 3.11 (barqaror)
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            wget \
            curl
          
      - name: Install Buildozer dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0  # Aniq versiya
          pip3 install cython==0.29.36   # Barqaror versiya
          
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-9477386_latest.zip
          
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0"  # 37 emas, 33
          
      - name: Build with Buildozer
        run: |
          # buildozer.spec ni tekshirish
          sed -i 's/requirements = .*/requirements = python3,kivy==2.2.1,kivymd==1.1.1/' buildozer.spec
          sed -i 's/p4a.source_dir = .*/# p4a.source_dir = /' buildozer.spec
          
          # Buildozer ni ishga tushirish
          buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: osonbilim-apk
          path: bin/*.apk
